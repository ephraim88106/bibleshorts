<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게시판 - 매일 성경 인물 묵상</title>
  <link href="/style.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <span class="logo-icon">✝</span>
        <span class="logo-text">매일 성경 인물 묵상</span>
      </a>
      <ul class="nav-menu">
        <li><a href="/" class="nav-link">홈</a></li>
        <li><a href="/board.html" class="nav-link active">게시판</a></li>
        <li><a href="/about.html" class="nav-link">소개</a></li>
      </ul>
      <button class="nav-toggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Board Header -->
  <div class="page-header">
    <div class="container">
      <h1 class="page-title">묵상 게시판</h1>
      <p class="page-desc">날짜별로 정리된 성경 인물 묵상 모음</p>
    </div>
  </div>

  <!-- Filter & Search -->
  <section class="section">
    <div class="container">
      <div class="board-controls">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="인물 또는 키워드 검색..." />
          <button id="search-btn" class="btn btn-primary">검색</button>
        </div>
        <div class="filter-tags" id="filter-tags">
          <button class="tag-btn active" data-filter="all">전체</button>
          <button class="tag-btn" data-filter="구약">구약</button>
          <button class="tag-btn" data-filter="신약">신약</button>
        </div>
      </div>

      <!-- Posts List -->
      <div class="board-list" id="board-list">
        <p class="loading-text">게시글을 불러오는 중...</p>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-logo">
          <span class="logo-icon">✝</span>
          <span>매일 성경 인물 묵상</span>
        </div>
        <p class="footer-verse">"주의 말씀은 내 발에 등이요 내 길에 빛이니이다" - 시편 119:105</p>
        <p class="footer-copy">&copy; 2026 매일 성경 인물 묵상. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script defer src="/main.js"></script>
</body>
</html>
